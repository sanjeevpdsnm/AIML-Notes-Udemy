<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG Typing Effect</title>
<style>
    /* Style the SVG text */
    svg {
        width: 100%;
        height: 150px;
        background: #111;
    }
    text {
        font-family: monospace;
        font-size: 40px;
        fill: none;
        stroke: #00ffcc;
        stroke-width: 1px;
        stroke-dasharray: 500; /* Total length of the path */
        stroke-dashoffset: 500; /* Initially hidden */
        animation: typing 4s steps(40) forwards;
    }

    /* Typing animation */
    @keyframes typing {
        to {
            stroke-dashoffset: 0;
        }
    }
</style>
</head>
<body>

<svg viewBox="0 0 800 150">
    <text x="50" y="100">Hello, SVG Typing!</text>
</svg>

</body>
</html>
